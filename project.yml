name: IsshinPlayer
options:
  bundleIdPrefix: com.isshin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: IsshinPlayer/Info.plist
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: com.isshin.player
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
targets:
  IsshinPlayer:
    type: application
    platform: iOS
    sources:
      - path: IsshinPlayer
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: IsshinPlayer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.isshin.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
